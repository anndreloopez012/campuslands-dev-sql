<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="90" class="box" />
  <text x="45" y="52" class="title">usuarios</text>
  <text x="45" y="72" class="attr">id_usuario (PK)</text>
  <text x="45" y="90" class="attr">correo (UNIQUE)</text>

  <rect x="700" y="30" width="220" height="100" class="box" />
  <text x="715" y="52" class="title">recursos</text>
  <text x="715" y="72" class="attr">id_recurso (PK)</text>
  <text x="715" y="90" class="attr">nombre (UNIQUE)</text>
  <text x="715" y="108" class="attr">precio_hora (CHECK)</text>

  <rect x="370" y="150" width="250" height="140" class="box" />
  <text x="385" y="172" class="title">reservas</text>
  <text x="385" y="192" class="attr">id_reserva (PK)</text>
  <text x="385" y="210" class="attr">id_usuario (FK), id_recurso (FK)</text>
  <text x="385" y="228" class="attr">fecha_inicio, fecha_fin (CHECK)</text>
  <text x="385" y="246" class="attr">estado (CHECK)</text>

  <rect x="370" y="330" width="250" height="90" class="box" />
  <text x="385" y="352" class="title">pagos</text>
  <text x="385" y="372" class="attr">id_pago (PK)</text>
  <text x="385" y="390" class="attr">id_reserva (FK, UNIQUE)</text>

  <path d="M250,75 C310,75 310,215 370,215" class="rel" />
  <text x="290" y="140" class="lbl">1 : N</text>

  <path d="M700,80 C660,80 660,215 620,215" class="rel" />
  <text x="650" y="140" class="lbl">1 : N</text>

  <path d="M495,290 V330" class="rel" />
  <text x="505" y="315" class="lbl">1 : 1</text>
</svg>
