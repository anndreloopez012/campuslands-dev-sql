<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="70" class="box" />
  <text x="45" y="52" class="title">clientes</text>
  <text x="45" y="72" class="attr">id_cliente (PK)</text>
  <text x="45" y="90" class="attr">nombre (UNIQUE)</text>

  <rect x="790" y="30" width="220" height="70" class="box" />
  <text x="805" y="52" class="title">vendedores</text>
  <text x="805" y="72" class="attr">id_vendedor (PK)</text>
  <text x="805" y="90" class="attr">nombre (UNIQUE)</text>

  <rect x="390" y="180" width="260" height="100" class="box" />
  <text x="405" y="202" class="title">operaciones</text>
  <text x="405" y="222" class="attr">id_operacion (PK)</text>
  <text x="405" y="240" class="attr">id_cliente (FK)</text>
  <text x="405" y="258" class="attr">id_vendedor (FK)</text>

  <rect x="30" y="360" width="240" height="90" class="box" />
  <text x="45" y="382" class="title">productos</text>
  <text x="45" y="402" class="attr">id_producto (PK)</text>
  <text x="45" y="420" class="attr">nombre (UNIQUE)</text>

  <rect x="330" y="360" width="260" height="110" class="box" />
  <text x="345" y="382" class="title">detalle_producto</text>
  <text x="345" y="402" class="attr">id_detalle (PK)</text>
  <text x="345" y="420" class="attr">id_operacion (FK), id_producto (FK)</text>
  <text x="345" y="438" class="attr">UNIQUE (id_operacion, id_producto)</text>
  <text x="345" y="456" class="lbl">1er hecho multivaluado</text>

  <rect x="650" y="360" width="260" height="120" class="box" />
  <text x="665" y="382" class="title">movimientos</text>
  <text x="665" y="402" class="attr">id_movimiento (PK)</text>
  <text x="665" y="420" class="attr">id_operacion (FK)</text>
  <text x="665" y="438" class="attr">metodo_pago, cuotas (CHECK)</text>
  <text x="665" y="456" class="attr">zona_entrega, estado (CHECK)</text>
  <text x="680" y="472" class="lbl">2do hecho multivaluado (independiente)</text>

  <path d="M250,65 C340,65 340,220 390,220" class="rel" />
  <text x="290" y="200" class="lbl">1 : N</text>

  <path d="M790,65 C700,65 700,220 650,220" class="rel" />
  <text x="740" y="200" class="lbl">1 : N</text>

  <path d="M460,280 C460,320 400,340 400,360" class="rel" />
  <text x="470" y="320" class="lbl">1 : N</text>

  <path d="M580,280 C650,300 750,320 780,360" class="rel" />
  <text x="700" y="300" class="lbl">1 : N</text>

  <path d="M150,360 V430 H330" class="rel" />
  <text x="200" y="352" class="lbl">1 : N</text>
</svg>
