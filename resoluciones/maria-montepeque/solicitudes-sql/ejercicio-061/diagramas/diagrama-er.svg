<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="100" class="box" />
  <text x="45" y="52" class="title">clientes</text>
  <text x="45" y="72" class="attr">id_cliente (PK)</text>
  <text x="45" y="90" class="attr">telefono (UNIQUE)</text>
  <text x="45" y="108" class="attr">nombre, direccion</text>

  <rect x="30" y="350" width="220" height="100" class="box" />
  <text x="45" y="372" class="title">menus</text>
  <text x="45" y="392" class="attr">id_menu (PK)</text>
  <text x="45" y="410" class="attr">restaurante, precio (CHECK)</text>
  <text x="45" y="428" class="attr">disponible</text>

  <rect x="750" y="30" width="220" height="110" class="box" />
  <text x="765" y="52" class="title">repartidores</text>
  <text x="765" y="72" class="attr">id_repartidor (PK)</text>
  <text x="765" y="90" class="attr">placa_vehiculo (UNIQUE)</text>
  <text x="765" y="108" class="attr">calificacion_promedio (CHECK)</text>

  <rect x="380" y="180" width="240" height="150" class="box" />
  <text x="395" y="202" class="title">pedidos</text>
  <text x="395" y="222" class="attr">id_pedido (PK)</text>
  <text x="395" y="240" class="attr">id_cliente (FK)</text>
  <text x="395" y="258" class="attr">id_menu (FK)</text>
  <text x="395" y="276" class="attr">id_repartidor (FK, nullable)</text>
  <text x="395" y="294" class="attr">cantidad, fecha_pedido</text>
  <text x="395" y="312" class="attr">estado (CHECK)</text>

  <rect x="380" y="390" width="240" height="80" class="box" />
  <text x="395" y="412" class="title">pagos</text>
  <text x="395" y="432" class="attr">id_pago (PK)</text>
  <text x="395" y="450" class="attr">id_pedido (FK, UNIQUE) - monto, metodo_pago, estado_pago</text>

  <path d="M250,80 C320,80 320,220 380,240" class="rel" />
  <text x="290" y="150" class="lbl">1 : N</text>

  <path d="M250,400 C320,400 320,280 380,270" class="rel" />
  <text x="290" y="340" class="lbl">1 : N</text>

  <path d="M750,85 C700,85 700,240 620,255" class="rel" />
  <text x="670" y="150" class="lbl">1 : N</text>

  <path d="M500,330 V390" class="rel" />
  <text x="510" y="365" class="lbl">1 : 1</text>
</svg>
