<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="30" width="220" height="110" class="box"/>
  <text x="30" y="50" class="title">experiencias</text>
  <text x="30" y="68" class="attr">id_experiencia PK</text>
  <text x="30" y="84" class="attr">nombre_experiencia UNIQUE</text>
  <text x="30" y="100" class="attr">tipo, precio</text>

  <rect x="20" y="180" width="220" height="90" class="box"/>
  <text x="30" y="200" class="title">clientes</text>
  <text x="30" y="218" class="attr">id_cliente PK</text>
  <text x="30" y="234" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="250" class="attr">telefono</text>

  <rect x="450" y="90" width="240" height="150" class="box"/>
  <text x="460" y="110" class="title">reservas</text>
  <text x="460" y="128" class="attr">id_reserva PK</text>
  <text x="460" y="144" class="attr">id_experiencia FK</text>
  <text x="460" y="160" class="attr">id_cliente FK</text>
  <text x="460" y="176" class="attr">fecha_reserva, monto_pagado</text>
  <text x="460" y="192" class="attr">estado</text>

  <line x1="240" y1="80" x2="450" y2="150"/>
  <text x="280" y="105" class="rel">1..N</text>

  <line x1="240" y1="220" x2="450" y2="180"/>
  <text x="280" y="225" class="rel">1..N</text>
</svg>
