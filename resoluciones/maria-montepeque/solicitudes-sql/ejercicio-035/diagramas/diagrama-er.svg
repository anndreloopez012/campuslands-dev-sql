<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="240" height="110" class="box"/>
  <text x="30" y="40" class="title">libros</text>
  <text x="30" y="58" class="attr">id_libro PK</text>
  <text x="30" y="74" class="attr">titulo UNIQUE</text>
  <text x="30" y="90" class="attr">autor, genero</text>
  <text x="30" y="106" class="attr">anio_publicacion</text>

  <rect x="20" y="190" width="240" height="90" class="box"/>
  <text x="30" y="210" class="title">lectores</text>
  <text x="30" y="228" class="attr">id_lector PK</text>
  <text x="30" y="244" class="attr">nombre_lector UNIQUE</text>
  <text x="30" y="260" class="attr">email</text>

  <rect x="470" y="90" width="270" height="150" class="box"/>
  <text x="480" y="110" class="title">prestamos</text>
  <text x="480" y="128" class="attr">id_prestamo PK</text>
  <text x="480" y="144" class="attr">id_libro FK</text>
  <text x="480" y="160" class="attr">id_lector FK</text>
  <text x="480" y="176" class="attr">fecha_prestamo, fecha_devolucion_esperada</text>
  <text x="480" y="192" class="attr">estado</text>

  <line x1="260" y1="70" x2="470" y2="150"/>
  <text x="300" y="95" class="rel">1..N</text>

  <line x1="260" y1="235" x2="470" y2="190"/>
  <text x="300" y="240" class="rel">1..N</text>
</svg>
