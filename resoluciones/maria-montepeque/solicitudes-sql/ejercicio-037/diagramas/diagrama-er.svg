<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">equipos</text>
  <text x="30" y="58" class="attr">id_equipo PK</text>
  <text x="30" y="74" class="attr">nombre_equipo UNIQUE</text>
  <text x="30" y="90" class="attr">ciudad</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">jugadores</text>
  <text x="30" y="238" class="attr">id_jugador PK</text>
  <text x="30" y="254" class="attr">nombre_jugador UNIQUE</text>
  <text x="30" y="270" class="attr">posicion, id_equipo FK</text>

  <rect x="470" y="90" width="270" height="160" class="box"/>
  <text x="480" y="110" class="title">partidos</text>
  <text x="480" y="128" class="attr">id_partido PK</text>
  <text x="480" y="144" class="attr">id_jugador FK</text>
  <text x="480" y="160" class="attr">id_equipo_rival FK</text>
  <text x="480" y="176" class="attr">fecha_partido, goles</text>
  <text x="480" y="192" class="attr">tarjeta, estado</text>

  <line x1="240" y1="65" x2="470" y2="140"/>
  <text x="290" y="90" class="rel">1..N (rival)</text>

  <line x1="240" y1="245" x2="470" y2="200"/>
  <text x="280" y="250" class="rel">1..N</text>

  <line x1="130" y1="110" x2="130" y2="200"/>
  <text x="140" y="160" class="rel">1..N (plantilla)</text>
</svg>
