<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="90" width="220" height="130" class="box"/>
  <text x="30" y="110" class="title">peliculas</text>
  <text x="30" y="128" class="attr">id_pelicula PK</text>
  <text x="30" y="144" class="attr">titulo UNIQUE</text>
  <text x="30" y="160" class="attr">genero, sala_asignada</text>
  <text x="30" y="176" class="attr">precio_boleto</text>

  <rect x="390" y="30" width="230" height="220" class="box"/>
  <text x="400" y="50" class="title">boletos</text>
  <text x="400" y="68" class="attr">id_boleto PK</text>
  <text x="400" y="84" class="attr">id_pelicula FK</text>
  <text x="400" y="100" class="attr">nombre_cliente</text>
  <text x="400" y="116" class="attr">asiento  UNIQUE(pelicula,asiento)</text>
  <text x="400" y="132" class="attr">precio_pagado</text>
  <text x="400" y="148" class="attr">fecha_compra</text>
  <text x="400" y="164" class="attr">estado</text>

  <line x1="240" y1="150" x2="390" y2="150"/>
  <text x="280" y="140" class="rel">1..N</text>
</svg>
