<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="90" class="attr">telefono</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">mecanicos</text>
  <text x="30" y="238" class="attr">id_mecanico PK</text>
  <text x="30" y="254" class="attr">nombre_mecanico UNIQUE</text>
  <text x="30" y="270" class="attr">especialidad</text>

  <rect x="380" y="90" width="260" height="130" class="box"/>
  <text x="390" y="110" class="title">ordenes_servicio</text>
  <text x="390" y="128" class="attr">id_orden PK</text>
  <text x="390" y="144" class="attr">id_cliente FK, id_mecanico FK</text>
  <text x="390" y="160" class="attr">placa_moto, fecha_orden</text>
  <text x="390" y="176" class="attr">costo_mano_obra, estado</text>

  <rect x="720" y="110" width="260" height="110" class="box"/>
  <text x="730" y="130" class="title">repuestos_usados</text>
  <text x="730" y="148" class="attr">id_detalle PK</text>
  <text x="730" y="164" class="attr">id_orden FK</text>
  <text x="730" y="180" class="attr">nombre_repuesto</text>
  <text x="730" y="196" class="attr">cantidad, costo_unitario</text>

  <line x1="240" y1="65" x2="380" y2="150"/>
  <text x="280" y="100" class="rel">1..N</text>

  <line x1="240" y1="245" x2="380" y2="190"/>
  <text x="280" y="240" class="rel">1..N</text>

  <line x1="640" y1="160" x2="720" y2="165"/>
  <text x="655" y="153" class="rel">1..N</text>
</svg>
