<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">productos</text>
  <text x="30" y="58" class="attr">id_producto PK</text>
  <text x="30" y="74" class="attr">nombre_producto UNIQUE</text>
  <text x="30" y="90" class="attr">marca, precio</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">clientes</text>
  <text x="30" y="238" class="attr">id_cliente PK</text>
  <text x="30" y="254" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="270" class="attr">telefono</text>

  <rect x="380" y="20" width="230" height="100" class="box"/>
  <text x="390" y="40" class="title">tallas</text>
  <text x="390" y="58" class="attr">id_talla PK</text>
  <text x="390" y="74" class="attr">id_producto FK</text>
  <text x="390" y="90" class="attr">numero_talla + id_producto UNIQUE</text>
  <text x="390" y="106" class="attr">stock</text>

  <rect x="720" y="110" width="260" height="140" class="box"/>
  <text x="730" y="130" class="title">pedidos</text>
  <text x="730" y="148" class="attr">id_pedido PK</text>
  <text x="730" y="164" class="attr">id_cliente FK, id_talla FK</text>
  <text x="730" y="180" class="attr">fecha_pedido, cantidad</text>
  <text x="730" y="196" class="attr">estado, stock_descontado</text>

  <line x1="240" y1="65" x2="380" y2="65"/>
  <text x="270" y="58" class="rel">1..N</text>

  <line x1="610" y1="65" x2="720" y2="160"/>
  <text x="630" y="100" class="rel">1..N</text>

  <line x1="240" y1="245" x2="720" y2="200"/>
  <text x="400" y="240" class="rel">1..N</text>
</svg>
