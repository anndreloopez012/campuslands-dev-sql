<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .view { fill: #eef6ee; stroke: #2d6a2d; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .titleview { font-weight: bold; font-size: 14px; fill: #1d4d1d; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">telefono UNIQUE</text>

  <rect x="20" y="270" width="220" height="90" class="box"/>
  <text x="30" y="290" class="title">experiencias</text>
  <text x="30" y="308" class="attr">id_experiencia PK</text>
  <text x="30" y="324" class="attr">nombre UNIQUE, tipo, precio</text>

  <rect x="330" y="150" width="240" height="110" class="box"/>
  <text x="340" y="170" class="title">reservas</text>
  <text x="340" y="188" class="attr">id_reserva PK</text>
  <text x="340" y="204" class="attr">id_cliente/experiencia/instructor FK</text>
  <text x="340" y="220" class="attr">UNIQUE(cliente,exp,fecha)</text>

  <rect x="20" y="150" width="220" height="90" class="box"/>
  <text x="30" y="170" class="title">instructores</text>
  <text x="30" y="188" class="attr">id_instructor PK</text>
  <text x="30" y="204" class="attr">nombre_instructor UNIQUE</text>

  <rect x="680" y="80" width="260" height="100" class="box"/>
  <text x="690" y="100" class="title">pagos</text>
  <text x="690" y="118" class="attr">id_pago PK</text>
  <text x="690" y="134" class="attr">id_reserva FK UNIQUE (1:1)</text>
  <text x="690" y="150" class="attr">monto, metodo_pago</text>

  <rect x="680" y="270" width="260" height="70" class="view"/>
  <text x="690" y="290" class="titleview">vista_resumen_reservas</text>
  <text x="690" y="306" class="attr">LEFT JOIN con pagos</text>

  <!-- clientes -> reservas -->
  <line x1="240" y1="90" x2="330" y2="200" />
  <text x="260" y="150" class="rel">1:N</text>

  <!-- experiencias -> reservas -->
  <line x1="240" y1="310" x2="330" y2="240" />
  <text x="260" y="280" class="rel">1:N</text>

  <!-- instructores -> reservas -->
  <line x1="240" y1="200" x2="330" y2="200" />
  <text x="260" y="190" class="rel">1:N</text>

  <!-- reservas -> pagos -->
  <line x1="570" y1="180" x2="680" y2="130" />
  <text x="600" y="160" class="rel">1:1</text>
</svg>
