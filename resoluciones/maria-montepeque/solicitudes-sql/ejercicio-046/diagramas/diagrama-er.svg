<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    .group { font-size: 11px; fill: #7a8ba3; font-style: italic; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <text x="30" y="18" class="group">catalogo</text>
  <rect x="20" y="25" width="210" height="90" class="box"/>
  <text x="30" y="45" class="title">jugadores</text>
  <text x="30" y="63" class="attr">id_jugador PK</text>
  <text x="30" y="79" class="attr">nombre_jugador UNIQUE</text>
  <text x="30" y="95" class="attr">plataforma</text>

  <text x="30" y="200" class="group">catalogo</text>
  <rect x="20" y="207" width="230" height="100" class="box"/>
  <text x="30" y="227" class="title">temporadas</text>
  <text x="30" y="245" class="attr">id_temporada PK</text>
  <text x="30" y="261" class="attr">nombre_temporada UNIQUE</text>
  <text x="30" y="277" class="attr">fecha_inicio, fecha_fin</text>
  <text x="30" y="293" class="attr">estado</text>

  <text x="400" y="200" class="group">operacion</text>
  <rect x="390" y="207" width="220" height="100" class="box"/>
  <text x="400" y="227" class="title">partidas</text>
  <text x="400" y="245" class="attr">id_partida PK</text>
  <text x="400" y="261" class="attr">id_temporada FK</text>
  <text x="400" y="277" class="attr">fecha_partida, mapa</text>
  <text x="400" y="293" class="attr">estado</text>

  <text x="700" y="18" class="group">resultado</text>
  <rect x="690" y="25" width="260" height="130" class="box"/>
  <text x="700" y="45" class="title">estadisticas</text>
  <text x="700" y="63" class="attr">id_estadistica PK</text>
  <text x="700" y="79" class="attr">id_partida FK</text>
  <text x="700" y="95" class="attr">id_jugador FK</text>
  <text x="700" y="111" class="attr">kills, posicion_final</text>
  <text x="700" y="127" class="attr">puntos</text>

  <line x1="250" y1="260" x2="390" y2="260"/>
  <text x="280" y="253" class="rel">1..N</text>

  <line x1="230" y1="70" x2="700" y2="90"/>
  <text x="400" y="70" class="rel">1..N</text>

  <line x1="610" y1="240" x2="820" y2="155"/>
  <text x="650" y="200" class="rel">1..N</text>
</svg>
