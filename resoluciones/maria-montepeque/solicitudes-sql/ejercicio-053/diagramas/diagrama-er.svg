<svg viewBox="0 0 1050 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="90" width="210" height="90" class="box"/>
  <text x="30" y="110" class="title">equipos</text>
  <text x="30" y="128" class="attr">id_equipo PK</text>
  <text x="30" y="144" class="attr">nombre_equipo UNIQUE</text>
  <text x="30" y="160" class="attr">region</text>

  <rect x="330" y="20" width="210" height="90" class="box"/>
  <text x="340" y="40" class="title">jugadores</text>
  <text x="340" y="58" class="attr">id_jugador PK</text>
  <text x="340" y="74" class="attr">nombre_jugador UNIQUE</text>
  <text x="340" y="90" class="attr">id_equipo FK, rol</text>

  <rect x="330" y="200" width="210" height="100" class="box"/>
  <text x="340" y="220" class="title">partidas</text>
  <text x="340" y="238" class="attr">id_partida PK</text>
  <text x="340" y="254" class="attr">id_equipo_rival FK</text>
  <text x="340" y="270" class="attr">fecha_partida, resultado</text>
  <text x="340" y="286" class="attr">estado</text>

  <rect x="700" y="110" width="260" height="120" class="box"/>
  <text x="710" y="130" class="title">estadisticas</text>
  <text x="710" y="148" class="attr">id_estadistica PK</text>
  <text x="710" y="164" class="attr">id_jugador FK, id_partida FK</text>
  <text x="710" y="180" class="attr">puntos, asistencias</text>

  <line x1="240" y1="120" x2="330" y2="70"/>
  <text x="260" y="90" class="rel">1..N</text>

  <line x1="240" y1="150" x2="330" y2="250"/>
  <text x="260" y="200" class="rel">1..N (rival)</text>

  <line x1="540" y1="70" x2="700" y2="150"/>
  <text x="600" y="100" class="rel">1..N</text>

  <line x1="540" y1="250" x2="700" y2="190"/>
  <text x="600" y="240" class="rel">1..N</text>
</svg>
