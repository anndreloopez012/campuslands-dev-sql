<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .view { fill: #eef6ee; stroke: #2d6a2d; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .titleview { font-weight: bold; font-size: 14px; fill: #1d4d1d; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">autores</text>
  <text x="30" y="58" class="attr">id_autor PK</text>
  <text x="30" y="74" class="attr">nombre_autor UNIQUE</text>
  <text x="30" y="90" class="attr">nacionalidad</text>

  <rect x="20" y="270" width="220" height="90" class="box"/>
  <text x="30" y="290" class="title">lectores</text>
  <text x="30" y="308" class="attr">id_lector PK</text>
  <text x="30" y="324" class="attr">nombre_lector UNIQUE</text>
  <text x="30" y="340" class="attr">email UNIQUE</text>

  <rect x="330" y="20" width="220" height="90" class="box"/>
  <text x="340" y="40" class="title">libros</text>
  <text x="340" y="58" class="attr">id_libro PK</text>
  <text x="340" y="74" class="attr">id_autor FK</text>
  <text x="340" y="90" class="attr">UNIQUE(titulo, autor)</text>

  <rect x="330" y="270" width="240" height="110" class="box"/>
  <text x="340" y="290" class="title">prestamos</text>
  <text x="340" y="308" class="attr">id_prestamo PK</text>
  <text x="340" y="324" class="attr">id_libro FK, id_lector FK</text>
  <text x="340" y="340" class="attr">estado CHECK</text>

  <rect x="680" y="270" width="260" height="100" class="box"/>
  <text x="690" y="290" class="title">devoluciones</text>
  <text x="690" y="308" class="attr">id_devolucion PK</text>
  <text x="690" y="324" class="attr">id_prestamo FK UNIQUE (1:1)</text>

  <rect x="680" y="20" width="260" height="70" class="view"/>
  <text x="690" y="40" class="titleview">vista_resumen_prestamos</text>
  <text x="690" y="56" class="attr">LEFT JOIN con devoluciones</text>

  <!-- autores -> libros -->
  <line x1="220" y1="65" x2="330" y2="65" />
  <text x="240" y="55" class="rel">1:N</text>

  <!-- libros -> prestamos -->
  <line x1="440" y1="110" x2="440" y2="270" />
  <text x="450" y="190" class="rel">1:N</text>

  <!-- lectores -> prestamos -->
  <line x1="240" y1="320" x2="330" y2="320" />
  <text x="260" y="310" class="rel">1:N</text>

  <!-- prestamos -> devoluciones -->
  <line x1="570" y1="320" x2="680" y2="320" />
  <text x="600" y="310" class="rel">1:1</text>
</svg>
