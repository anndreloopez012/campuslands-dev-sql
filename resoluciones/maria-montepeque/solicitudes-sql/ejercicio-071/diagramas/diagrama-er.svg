<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">jugadores</text>
  <text x="30" y="58" class="attr">id_jugador PK</text>
  <text x="30" y="74" class="attr">nickname UNIQUE</text>
  <text x="30" y="90" class="attr">region</text>

  <rect x="20" y="270" width="200" height="90" class="box"/>
  <text x="30" y="290" class="title">temporadas</text>
  <text x="30" y="308" class="attr">id_temporada PK</text>
  <text x="30" y="324" class="attr">nombre_temporada UNIQUE</text>
  <text x="30" y="340" class="attr">fecha_inicio, fecha_fin</text>

  <rect x="330" y="270" width="220" height="110" class="box"/>
  <text x="340" y="290" class="title">partidas</text>
  <text x="340" y="308" class="attr">id_partida PK</text>
  <text x="340" y="324" class="attr">id_temporada FK</text>
  <text x="340" y="340" class="attr">fecha_partida, mapa</text>
  <text x="340" y="356" class="attr">estado CHECK</text>

  <rect x="650" y="130" width="240" height="120" class="box"/>
  <text x="660" y="150" class="title">estadisticas</text>
  <text x="660" y="168" class="attr">id_estadistica PK</text>
  <text x="660" y="184" class="attr">id_partida FK, id_jugador FK</text>
  <text x="660" y="200" class="attr">kills CHECK &gt;= 0</text>
  <text x="660" y="216" class="attr">UNIQUE (id_partida, id_jugador)</text>

  <rect x="650" y="20" width="240" height="90" class="box"/>
  <text x="660" y="40" class="title">ranking</text>
  <text x="660" y="58" class="attr">id_ranking PK</text>
  <text x="660" y="74" class="attr">id_temporada FK, id_jugador FK</text>
  <text x="660" y="90" class="attr">UNIQUE (id_temporada, id_jugador)</text>

  <!-- jugadores -> estadisticas -->
  <line x1="220" y1="90" x2="650" y2="190" />
  <text x="400" y="130" class="rel">1:N</text>

  <!-- jugadores -> ranking -->
  <line x1="220" y1="60" x2="650" y2="60" />
  <text x="400" y="50" class="rel">1:N</text>

  <!-- temporadas -> partidas -->
  <line x1="220" y1="320" x2="330" y2="320" />
  <text x="240" y="310" class="rel">1:N</text>

  <!-- temporadas -> ranking -->
  <line x1="120" y1="270" x2="700" y2="110" />
  <text x="420" y="230" class="rel">1:N</text>

  <!-- partidas -> estadisticas -->
  <line x1="550" y1="300" x2="650" y2="230" />
  <text x="560" y="270" class="rel">1:N</text>
</svg>
