<svg viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">peliculas</text>
  <text x="30" y="58" class="attr">id_pelicula PK</text>
  <text x="30" y="74" class="attr">titulo UNIQUE</text>
  <text x="30" y="90" class="attr">clasificacion, duracion_minutos</text>

  <rect x="20" y="270" width="200" height="80" class="box"/>
  <text x="30" y="290" class="title">salas</text>
  <text x="30" y="308" class="attr">id_sala PK</text>
  <text x="30" y="324" class="attr">nombre_sala UNIQUE, capacidad</text>

  <rect x="330" y="130" width="230" height="110" class="box"/>
  <text x="340" y="150" class="title">funciones</text>
  <text x="340" y="168" class="attr">id_funcion PK</text>
  <text x="340" y="184" class="attr">id_pelicula FK, id_sala FK</text>
  <text x="340" y="200" class="attr">fecha_funcion, hora_funcion</text>
  <text x="340" y="216" class="attr">estado CHECK</text>

  <rect x="680" y="20" width="260" height="110" class="box"/>
  <text x="690" y="40" class="title">boletos</text>
  <text x="690" y="58" class="attr">id_boleto PK</text>
  <text x="690" y="74" class="attr">id_funcion FK</text>
  <text x="690" y="90" class="attr">asiento, precio</text>
  <text x="690" y="106" class="attr">UNIQUE(funcion, asiento)</text>

  <rect x="680" y="230" width="260" height="100" class="box"/>
  <text x="690" y="250" class="title">pagos</text>
  <text x="690" y="268" class="attr">id_pago PK</text>
  <text x="690" y="284" class="attr">id_boleto FK UNIQUE (1:1)</text>
  <text x="690" y="300" class="attr">monto, metodo_pago</text>

  <!-- peliculas -> funciones -->
  <line x1="220" y1="90" x2="330" y2="180" />
  <text x="250" y="150" class="rel">1:N</text>

  <!-- salas -> funciones -->
  <line x1="220" y1="300" x2="330" y2="220" />
  <text x="250" y="270" class="rel">1:N</text>

  <!-- funciones -> boletos -->
  <line x1="560" y1="170" x2="680" y2="90" />
  <text x="590" y="140" class="rel">1:N</text>

  <!-- boletos -> pagos -->
  <line x1="810" y1="130" x2="810" y2="230" />
  <text x="820" y="185" class="rel">1:1</text>
</svg>
