<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="100" class="box"/>
  <text x="30" y="40" class="title">clanes</text>
  <text x="30" y="58" class="attr">id_clan PK</text>
  <text x="30" y="74" class="attr">nombre_clan, tag UNIQUE</text>
  <text x="30" y="90" class="attr">region</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">jugadores</text>
  <text x="30" y="238" class="attr">id_jugador PK</text>
  <text x="30" y="254" class="attr">nombre_jugador UNIQUE</text>
  <text x="30" y="270" class="attr">id_clan FK, rol</text>

  <rect x="330" y="20" width="220" height="90" class="box"/>
  <text x="340" y="40" class="title">mapas</text>
  <text x="340" y="58" class="attr">id_mapa PK</text>
  <text x="340" y="74" class="attr">nombre_mapa UNIQUE</text>
  <text x="340" y="90" class="attr">modo</text>

  <rect x="680" y="110" width="280" height="150" class="box"/>
  <text x="690" y="130" class="title">scrims</text>
  <text x="690" y="148" class="attr">id_scrim PK</text>
  <text x="690" y="164" class="attr">id_clan_rival FK</text>
  <text x="690" y="180" class="attr">id_mapa FK</text>
  <text x="690" y="196" class="attr">fecha_scrim</text>
  <text x="690" y="212" class="attr">rondas_ganadas, rondas_perdidas</text>
  <text x="690" y="228" class="attr">estado</text>

  <line x1="230" y1="245" x2="680" y2="200"/>
  <text x="400" y="240" class="rel">1..N (plantilla)</text>

  <line x1="240" y1="70" x2="680" y2="170"/>
  <text x="380" y="90" class="rel">1..N (rival)</text>

  <line x1="550" y1="65" x2="680" y2="190"/>
  <text x="570" y="100" class="rel">1..N</text>
</svg>
