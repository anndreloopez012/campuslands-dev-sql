<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="90" width="220" height="130" class="box"/>
  <text x="30" y="110" class="title">productos</text>
  <text x="30" y="128" class="attr">id_producto PK</text>
  <text x="30" y="144" class="attr">nombre_producto UNIQUE</text>
  <text x="30" y="160" class="attr">precio</text>
  <text x="30" y="176" class="attr">categoria</text>
  <text x="30" y="192" class="attr">stock</text>

  <rect x="380" y="40" width="220" height="220" class="box"/>
  <text x="390" y="60" class="title">ventas</text>
  <text x="390" y="78" class="attr">id_venta PK</text>
  <text x="390" y="94" class="attr">id_producto FK</text>
  <text x="390" y="110" class="attr">nombre_cliente</text>
  <text x="390" y="126" class="attr">cantidad</text>
  <text x="390" y="142" class="attr">precio_pagado</text>
  <text x="390" y="158" class="attr">fecha_venta</text>
  <text x="390" y="174" class="attr">estado</text>

  <line x1="240" y1="150" x2="380" y2="150"/>
  <text x="280" y="140" class="rel">1..N</text>
</svg>
