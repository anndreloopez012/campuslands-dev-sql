<svg viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="150" width="200" height="90" class="box"/>
  <text x="30" y="170" class="title">clientes</text>
  <text x="30" y="188" class="attr">id_cliente PK</text>
  <text x="30" y="204" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="220" class="attr">telefono UNIQUE</text>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">tecnicos</text>
  <text x="30" y="58" class="attr">id_tecnico PK</text>
  <text x="30" y="74" class="attr">nombre_tecnico UNIQUE</text>
  <text x="30" y="90" class="attr">especialidad</text>

  <rect x="330" y="90" width="220" height="110" class="box"/>
  <text x="340" y="110" class="title">ordenes</text>
  <text x="340" y="128" class="attr">id_orden PK</text>
  <text x="340" y="144" class="attr">id_cliente FK, id_tecnico FK</text>
  <text x="340" y="160" class="attr">descripcion, fecha_orden</text>
  <text x="340" y="176" class="attr">estado CHECK</text>

  <rect x="650" y="20" width="220" height="110" class="box"/>
  <text x="660" y="40" class="title">materiales</text>
  <text x="660" y="58" class="attr">id_material PK</text>
  <text x="660" y="74" class="attr">id_orden FK</text>
  <text x="660" y="90" class="attr">cantidad CHECK &gt; 0</text>
  <text x="660" y="106" class="attr">costo_unitario CHECK &gt;= 0</text>

  <rect x="650" y="170" width="220" height="120" class="box"/>
  <text x="660" y="190" class="title">inspecciones</text>
  <text x="660" y="208" class="attr">id_inspeccion PK</text>
  <text x="660" y="224" class="attr">id_orden FK</text>
  <text x="660" y="240" class="attr">fecha_inspeccion</text>
  <text x="660" y="256" class="attr">resultado CHECK</text>

  <!-- clientes -> ordenes -->
  <line x1="220" y1="195" x2="330" y2="160" />
  <text x="225" y="180" class="rel">1:N</text>

  <!-- tecnicos -> ordenes -->
  <line x1="220" y1="80" x2="330" y2="130" />
  <text x="225" y="95" class="rel">1:N</text>

  <!-- ordenes -> materiales -->
  <line x1="550" y1="120" x2="650" y2="75" />
  <text x="560" y="90" class="rel">1:N</text>

  <!-- ordenes -> inspecciones -->
  <line x1="550" y1="170" x2="650" y2="215" />
  <text x="560" y="200" class="rel">1:N</text>
</svg>
