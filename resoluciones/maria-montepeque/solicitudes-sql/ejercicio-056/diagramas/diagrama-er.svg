<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    .group { font-size: 11px; fill: #7a8ba3; font-style: italic; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <text x="30" y="18" class="group">catalogo</text>
  <rect x="20" y="25" width="220" height="90" class="box"/>
  <text x="30" y="45" class="title">clientes</text>
  <text x="30" y="63" class="attr">id_cliente PK</text>
  <text x="30" y="79" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="95" class="attr">licencia_conducir UNIQUE</text>

  <text x="30" y="200" class="group">catalogo</text>
  <rect x="20" y="207" width="220" height="90" class="box"/>
  <text x="30" y="227" class="title">vehiculos</text>
  <text x="30" y="245" class="attr">id_vehiculo PK</text>
  <text x="30" y="261" class="attr">placa UNIQUE</text>
  <text x="30" y="277" class="attr">modelo, tarifa_diaria</text>

  <text x="400" y="90" class="group">operacion</text>
  <rect x="390" y="97" width="220" height="110" class="box"/>
  <text x="400" y="117" class="title">reservas</text>
  <text x="400" y="135" class="attr">id_reserva PK</text>
  <text x="400" y="151" class="attr">id_cliente FK, id_vehiculo FK</text>
  <text x="400" y="167" class="attr">fecha_inicio, fecha_fin</text>
  <text x="400" y="183" class="attr">estado</text>

  <text x="720" y="18" class="group">resultado</text>
  <rect x="710" y="25" width="260" height="120" class="box"/>
  <text x="720" y="45" class="title">pagos</text>
  <text x="720" y="63" class="attr">id_pago PK</text>
  <text x="720" y="79" class="attr">id_reserva FK</text>
  <text x="720" y="95" class="attr">monto, fecha_pago</text>
  <text x="720" y="111" class="attr">metodo, estado</text>

  <line x1="240" y1="70" x2="390" y2="140"/>
  <text x="280" y="100" class="rel">1..N</text>

  <line x1="240" y1="250" x2="390" y2="180"/>
  <text x="280" y="245" class="rel">1..N</text>

  <line x1="610" y1="150" x2="710" y2="90"/>
  <text x="630" y="130" class="rel">1..N</text>
</svg>
