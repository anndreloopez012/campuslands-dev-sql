<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .view { fill: #eef6ee; stroke: #2d6a2d; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .titleview { font-weight: bold; font-size: 14px; fill: #1d4d1d; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="80" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">telefono UNIQUE</text>

  <rect x="20" y="150" width="200" height="80" class="box"/>
  <text x="30" y="170" class="title">menus</text>
  <text x="30" y="188" class="attr">id_menu PK</text>
  <text x="30" y="204" class="attr">nombre_platillo UNIQUE</text>

  <rect x="20" y="280" width="220" height="80" class="box"/>
  <text x="30" y="300" class="title">repartidores</text>
  <text x="30" y="318" class="attr">id_repartidor PK</text>
  <text x="30" y="334" class="attr">nombre_repartidor UNIQUE</text>

  <rect x="330" y="150" width="240" height="110" class="box"/>
  <text x="340" y="170" class="title">pedidos</text>
  <text x="340" y="188" class="attr">id_pedido PK</text>
  <text x="340" y="204" class="attr">id_cliente/menu/repartidor FK</text>
  <text x="340" y="220" class="attr">estado CHECK</text>

  <rect x="680" y="80" width="260" height="90" class="box"/>
  <text x="690" y="100" class="title">pagos</text>
  <text x="690" y="118" class="attr">id_pago PK</text>
  <text x="690" y="134" class="attr">id_pedido FK UNIQUE (1:1)</text>

  <rect x="680" y="270" width="260" height="70" class="view"/>
  <text x="690" y="290" class="titleview">vista_pedidos_completos</text>
  <text x="690" y="306" class="attr">JOIN de las 5 tablas</text>

  <!-- clientes -> pedidos -->
  <line x1="220" y1="60" x2="330" y2="190" />
  <text x="250" y="130" class="rel">1:N</text>

  <!-- menus -> pedidos -->
  <line x1="220" y1="190" x2="330" y2="190" />
  <text x="250" y="180" class="rel">1:N</text>

  <!-- repartidores -> pedidos -->
  <line x1="240" y1="310" x2="330" y2="230" />
  <text x="260" y="280" class="rel">1:N</text>

  <!-- pedidos -> pagos -->
  <line x1="570" y1="180" x2="680" y2="130" />
  <text x="600" y="160" class="rel">1:1</text>
</svg>
