<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="90" class="attr">carnet UNIQUE</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">productos</text>
  <text x="30" y="238" class="attr">id_producto PK</text>
  <text x="30" y="254" class="attr">nombre_producto UNIQUE</text>
  <text x="30" y="270" class="attr">categoria, precio</text>

  <rect x="380" y="20" width="210" height="90" class="box"/>
  <text x="390" y="40" class="title">ventas</text>
  <text x="390" y="58" class="attr">id_venta PK</text>
  <text x="390" y="74" class="attr">id_cliente FK</text>
  <text x="390" y="90" class="attr">fecha_venta, estado</text>

  <rect x="700" y="110" width="260" height="120" class="box"/>
  <text x="710" y="130" class="title">detalle_ventas</text>
  <text x="710" y="148" class="attr">id_detalle PK</text>
  <text x="710" y="164" class="attr">id_venta FK, id_producto FK</text>
  <text x="710" y="180" class="attr">cantidad, precio_unitario</text>

  <line x1="240" y1="65" x2="380" y2="65"/>
  <text x="270" y="58" class="rel">1..N</text>

  <line x1="590" y1="65" x2="700" y2="150"/>
  <text x="610" y="100" class="rel">1..N</text>

  <line x1="240" y1="245" x2="700" y2="200"/>
  <text x="400" y="240" class="rel">1..N</text>
</svg>
