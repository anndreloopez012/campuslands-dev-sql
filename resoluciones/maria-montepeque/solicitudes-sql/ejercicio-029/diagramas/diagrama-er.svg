<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="80" width="200" height="90" class="box"/>
  <text x="30" y="100" class="title">clientes</text>
  <text x="30" y="118" class="attr">id_cliente PK</text>
  <text x="30" y="134" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="150" class="attr">email UNIQUE</text>

  <rect x="350" y="70" width="220" height="110" class="box"/>
  <text x="360" y="90" class="title">pedidos</text>
  <text x="360" y="108" class="attr">id_pedido PK</text>
  <text x="360" y="124" class="attr">id_cliente FK</text>
  <text x="360" y="140" class="attr">nombre_modelo, talla</text>
  <text x="360" y="156" class="attr">precio</text>

  <rect x="670" y="30" width="220" height="180" class="box"/>
  <text x="680" y="50" class="title">eventos_pedido (historico)</text>
  <text x="680" y="68" class="attr">id_evento PK</text>
  <text x="680" y="84" class="attr">id_pedido FK</text>
  <text x="680" y="100" class="attr">tipo_evento</text>
  <text x="680" y="116" class="attr">fecha_evento</text>
  <text x="680" y="132" class="attr">estado</text>
  <text x="680" y="148" class="attr">comentario</text>

  <line x1="220" y1="125" x2="350" y2="125"/>
  <text x="260" y="115" class="rel">1..N</text>

  <line x1="570" y1="125" x2="670" y2="120"/>
  <text x="600" y="115" class="rel">1..N</text>
</svg>
