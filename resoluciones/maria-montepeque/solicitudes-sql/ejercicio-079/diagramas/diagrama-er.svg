<svg viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">nombre_cliente</text>
  <text x="30" y="90" class="attr">telefono UNIQUE</text>

  <rect x="330" y="20" width="220" height="90" class="box"/>
  <text x="340" y="40" class="title">pedidos</text>
  <text x="340" y="58" class="attr">id_pedido PK</text>
  <text x="340" y="74" class="attr">id_cliente FK</text>
  <text x="340" y="90" class="attr">estado CHECK</text>

  <rect x="680" y="150" width="260" height="130" class="box"/>
  <text x="690" y="170" class="title">detalle_pedidos</text>
  <text x="690" y="188" class="attr">id_detalle PK</text>
  <text x="690" y="204" class="attr">id_pedido FK</text>
  <text x="690" y="220" class="attr">id_producto FK, id_talla FK</text>
  <text x="690" y="236" class="attr">UNIQUE(pedido,producto,talla)</text>

  <rect x="330" y="270" width="220" height="80" class="box"/>
  <text x="340" y="290" class="title">productos</text>
  <text x="340" y="308" class="attr">id_producto PK</text>
  <text x="340" y="324" class="attr">nombre_producto, marca</text>

  <rect x="20" y="270" width="200" height="80" class="box"/>
  <text x="30" y="290" class="title">tallas</text>
  <text x="30" y="308" class="attr">id_talla PK</text>
  <text x="30" y="324" class="attr">numero_talla UNIQUE</text>

  <!-- clientes -> pedidos -->
  <line x1="220" y1="65" x2="330" y2="65" />
  <text x="240" y="55" class="rel">1:N</text>

  <!-- pedidos -> detalle -->
  <line x1="550" y1="90" x2="680" y2="200" />
  <text x="590" y="150" class="rel">1:N</text>

  <!-- productos -> detalle -->
  <line x1="550" y1="310" x2="680" y2="260" />
  <text x="590" y="290" class="rel">1:N</text>

  <!-- tallas -> detalle -->
  <line x1="220" y1="310" x2="680" y2="270" />
  <text x="450" y="300" class="rel">1:N</text>
</svg>
