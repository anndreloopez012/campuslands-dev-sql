<svg viewBox="0 0 1050 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="210" height="90" class="box"/>
  <text x="30" y="40" class="title">equipos</text>
  <text x="30" y="58" class="attr">id_equipo PK</text>
  <text x="30" y="74" class="attr">nombre_equipo UNIQUE</text>
  <text x="30" y="90" class="attr">region</text>

  <rect x="20" y="230" width="210" height="90" class="box"/>
  <text x="30" y="250" class="title">jugadores</text>
  <text x="30" y="268" class="attr">id_jugador PK</text>
  <text x="30" y="284" class="attr">nombre_jugador UNIQUE</text>
  <text x="30" y="300" class="attr">id_equipo FK, posicion</text>

  <rect x="330" y="20" width="210" height="90" class="box"/>
  <text x="340" y="40" class="title">heroes</text>
  <text x="340" y="58" class="attr">id_heroe PK</text>
  <text x="340" y="74" class="attr">nombre_heroe UNIQUE</text>
  <text x="340" y="90" class="attr">rol</text>

  <rect x="680" y="120" width="300" height="170" class="box"/>
  <text x="690" y="140" class="title">partidas</text>
  <text x="690" y="158" class="attr">id_partida PK</text>
  <text x="690" y="174" class="attr">id_jugador FK</text>
  <text x="690" y="190" class="attr">id_heroe FK</text>
  <text x="690" y="206" class="attr">id_equipo_rival FK</text>
  <text x="690" y="222" class="attr">fecha_partida</text>
  <text x="690" y="238" class="attr">kills, deaths, assists</text>
  <text x="690" y="254" class="attr">resultado, estado</text>

  <line x1="230" y1="275" x2="680" y2="230"/>
  <text x="400" y="260" class="rel">1..N (plantilla)</text>

  <line x1="230" y1="65" x2="680" y2="170"/>
  <text x="380" y="90" class="rel">1..N (rival)</text>

  <line x1="540" y1="65" x2="680" y2="190"/>
  <text x="560" y="100" class="rel">1..N</text>
</svg>
