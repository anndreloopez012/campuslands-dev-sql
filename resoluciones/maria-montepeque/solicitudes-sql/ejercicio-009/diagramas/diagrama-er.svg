<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="80" width="220" height="140" class="box"/>
  <text x="30" y="100" class="title">proyectos</text>
  <text x="30" y="118" class="attr">id_proyecto PK</text>
  <text x="30" y="134" class="attr">nombre_proyecto UNIQUE</text>
  <text x="30" y="150" class="attr">cliente</text>
  <text x="30" y="166" class="attr">artista_asignado</text>
  <text x="30" y="182" class="attr">estado_actual</text>

  <rect x="390" y="30" width="230" height="220" class="box"/>
  <text x="400" y="50" class="title">entregas (historico)</text>
  <text x="400" y="68" class="attr">id_entrega PK</text>
  <text x="400" y="84" class="attr">id_proyecto FK</text>
  <text x="400" y="100" class="attr">tipo_evento</text>
  <text x="400" y="116" class="attr">fecha_evento</text>
  <text x="400" y="132" class="attr">estado</text>
  <text x="400" y="148" class="attr">comentario</text>

  <line x1="240" y1="150" x2="390" y2="140"/>
  <text x="280" y="135" class="rel">1..N</text>
</svg>
