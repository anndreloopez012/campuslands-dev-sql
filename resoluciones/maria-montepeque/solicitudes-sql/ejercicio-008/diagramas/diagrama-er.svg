<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="100" width="220" height="110" class="box"/>
  <text x="30" y="120" class="title">experiencias</text>
  <text x="30" y="138" class="attr">id_experiencia PK</text>
  <text x="30" y="154" class="attr">nombre_experiencia UNIQUE</text>
  <text x="30" y="170" class="attr">tipo, precio</text>

  <rect x="390" y="50" width="230" height="180" class="box"/>
  <text x="400" y="70" class="title">reservas</text>
  <text x="400" y="88" class="attr">id_reserva PK</text>
  <text x="400" y="104" class="attr">id_experiencia FK</text>
  <text x="400" y="120" class="attr">nombre_cliente</text>
  <text x="400" y="136" class="attr">fecha_reserva</text>
  <text x="400" y="152" class="attr">monto_pagado</text>
  <text x="400" y="168" class="attr">estado</text>

  <line x1="240" y1="150" x2="390" y2="140"/>
  <text x="280" y="135" class="rel">1..N</text>
</svg>
