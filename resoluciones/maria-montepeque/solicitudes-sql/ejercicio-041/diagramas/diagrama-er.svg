<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">huespedes</text>
  <text x="30" y="58" class="attr">id_huesped PK</text>
  <text x="30" y="74" class="attr">nombre_huesped UNIQUE</text>
  <text x="30" y="90" class="attr">email UNIQUE</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">habitaciones</text>
  <text x="30" y="238" class="attr">id_habitacion PK</text>
  <text x="30" y="254" class="attr">numero_habitacion UNIQUE</text>
  <text x="30" y="270" class="attr">tipo, precio_noche</text>

  <rect x="380" y="100" width="240" height="140" class="box"/>
  <text x="390" y="120" class="title">reservas</text>
  <text x="390" y="138" class="attr">id_reserva PK</text>
  <text x="390" y="154" class="attr">id_huesped FK</text>
  <text x="390" y="170" class="attr">id_habitacion FK</text>
  <text x="390" y="186" class="attr">fecha_checkin, fecha_checkout</text>
  <text x="390" y="202" class="attr">estado</text>

  <rect x="730" y="110" width="240" height="120" class="box"/>
  <text x="740" y="130" class="title">consumos</text>
  <text x="740" y="148" class="attr">id_consumo PK</text>
  <text x="740" y="164" class="attr">id_reserva FK</text>
  <text x="740" y="180" class="attr">descripcion, monto</text>
  <text x="740" y="196" class="attr">fecha_consumo</text>

  <line x1="240" y1="65" x2="380" y2="150"/>
  <text x="270" y="100" class="rel">1..N</text>

  <line x1="240" y1="245" x2="380" y2="200"/>
  <text x="270" y="240" class="rel">1..N</text>

  <line x1="620" y1="170" x2="730" y2="170"/>
  <text x="650" y="163" class="rel">1..N</text>
</svg>
