<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">nombre_cliente UNIQUE</text>
  <text x="30" y="90" class="attr">telefono</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">tecnicos</text>
  <text x="30" y="238" class="attr">id_tecnico PK</text>
  <text x="30" y="254" class="attr">nombre_tecnico UNIQUE</text>
  <text x="30" y="270" class="attr">certificacion</text>

  <rect x="380" y="100" width="260" height="140" class="box"/>
  <text x="390" y="120" class="title">ordenes</text>
  <text x="390" y="138" class="attr">id_orden PK</text>
  <text x="390" y="154" class="attr">id_cliente FK</text>
  <text x="390" y="170" class="attr">id_tecnico FK</text>
  <text x="390" y="186" class="attr">descripcion, fecha_orden</text>
  <text x="390" y="202" class="attr">costo_total, estado</text>

  <rect x="730" y="110" width="240" height="120" class="box"/>
  <text x="740" y="130" class="title">materiales</text>
  <text x="740" y="148" class="attr">id_material PK</text>
  <text x="740" y="164" class="attr">id_orden FK</text>
  <text x="740" y="180" class="attr">nombre_material</text>
  <text x="740" y="196" class="attr">cantidad, costo_unitario</text>

  <line x1="240" y1="65" x2="380" y2="150"/>
  <text x="270" y="100" class="rel">1..N</text>

  <line x1="240" y1="245" x2="380" y2="200"/>
  <text x="270" y="240" class="rel">1..N</text>

  <line x1="640" y1="170" x2="730" y2="170"/>
  <text x="660" y="163" class="rel">1..N</text>
</svg>
