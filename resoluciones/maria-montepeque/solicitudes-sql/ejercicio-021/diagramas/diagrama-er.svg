<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="30" width="200" height="100" class="box"/>
  <text x="30" y="50" class="title">jugadores</text>
  <text x="30" y="68" class="attr">id_jugador PK</text>
  <text x="30" y="84" class="attr">gamertag UNIQUE</text>
  <text x="30" y="100" class="attr">equipo, nivel</text>

  <rect x="20" y="190" width="200" height="90" class="box"/>
  <text x="30" y="210" class="title">partidas</text>
  <text x="30" y="228" class="attr">id_partida PK</text>
  <text x="30" y="244" class="attr">mapa, fecha_partida</text>
  <text x="30" y="260" class="attr">total_jugadores</text>

  <rect x="410" y="100" width="260" height="150" class="box"/>
  <text x="420" y="120" class="title">estadisticas (detalle)</text>
  <text x="420" y="138" class="attr">id_estadistica PK</text>
  <text x="420" y="154" class="attr">id_jugador FK</text>
  <text x="420" y="170" class="attr">id_partida FK</text>
  <text x="420" y="186" class="attr">kills, posicion_final</text>
  <text x="420" y="202" class="attr">estado</text>

  <line x1="220" y1="90" x2="410" y2="150"/>
  <text x="260" y="115" class="rel">1..N</text>

  <line x1="220" y1="230" x2="410" y2="200"/>
  <text x="260" y="235" class="rel">1..N</text>
</svg>
