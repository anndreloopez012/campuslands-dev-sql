<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="90" width="220" height="110" class="box"/>
  <text x="30" y="110" class="title">menus</text>
  <text x="30" y="128" class="attr">id_menu PK</text>
  <text x="30" y="144" class="attr">nombre_platillo UNIQUE</text>
  <text x="30" y="160" class="attr">categoria, precio</text>

  <rect x="390" y="20" width="230" height="240" class="box"/>
  <text x="400" y="40" class="title">pedidos</text>
  <text x="400" y="58" class="attr">id_pedido PK</text>
  <text x="400" y="74" class="attr">id_menu FK</text>
  <text x="400" y="90" class="attr">nombre_cliente</text>
  <text x="400" y="106" class="attr">repartidor</text>
  <text x="400" y="122" class="attr">cantidad, monto_total</text>
  <text x="400" y="138" class="attr">fecha_pedido</text>
  <text x="400" y="154" class="attr">estado</text>
  <text x="400" y="170" class="attr">calificacion (opcional)</text>

  <line x1="240" y1="145" x2="390" y2="140"/>
  <text x="280" y="130" class="rel">1..N</text>
</svg>
