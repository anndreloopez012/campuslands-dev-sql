<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">usuarios</text>
  <text x="30" y="58" class="attr">id_usuario PK</text>
  <text x="30" y="74" class="attr">nombre_usuario UNIQUE</text>
  <text x="30" y="90" class="attr">email UNIQUE</text>

  <rect x="20" y="270" width="200" height="80" class="box"/>
  <text x="30" y="290" class="title">clubes</text>
  <text x="30" y="308" class="attr">id_club PK</text>
  <text x="30" y="324" class="attr">nombre_club UNIQUE, liga</text>

  <rect x="330" y="20" width="220" height="90" class="box"/>
  <text x="340" y="40" class="title">jornadas</text>
  <text x="340" y="58" class="attr">id_jornada PK</text>
  <text x="340" y="74" class="attr">numero_jornada UNIQUE</text>
  <text x="340" y="90" class="attr">fecha_inicio, fecha_fin</text>

  <rect x="330" y="230" width="240" height="130" class="box"/>
  <text x="340" y="250" class="title">partidos</text>
  <text x="340" y="268" class="attr">id_partido PK</text>
  <text x="340" y="284" class="attr">id_jornada FK</text>
  <text x="340" y="300" class="attr">id_usuario_local/visitante FK</text>
  <text x="340" y="316" class="attr">id_club_local/visitante FK</text>
  <text x="340" y="332" class="attr">estado CHECK</text>

  <rect x="680" y="250" width="240" height="100" class="box"/>
  <text x="690" y="270" class="title">goles</text>
  <text x="690" y="288" class="attr">id_gol PK</text>
  <text x="690" y="304" class="attr">id_partido FK, id_club FK</text>
  <text x="690" y="320" class="attr">minuto CHECK 1-120</text>

  <!-- usuarios -> partidos -->
  <line x1="120" y1="110" x2="400" y2="230" />
  <text x="250" y="180" class="rel">1:N</text>

  <!-- clubes -> partidos -->
  <line x1="220" y1="310" x2="330" y2="300" />
  <text x="240" y="300" class="rel">1:N</text>

  <!-- jornadas -> partidos -->
  <line x1="440" y1="110" x2="440" y2="230" />
  <text x="450" y="180" class="rel">1:N</text>

  <!-- partidos -> goles -->
  <line x1="570" y1="300" x2="680" y2="300" />
  <text x="600" y="290" class="rel">1:N</text>

  <!-- clubes -> goles -->
  <line x1="220" y1="330" x2="680" y2="330" />
  <text x="450" y="345" class="rel">1:N</text>
</svg>
