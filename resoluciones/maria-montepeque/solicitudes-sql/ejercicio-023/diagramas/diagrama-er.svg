<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="100" width="200" height="90" class="box"/>
  <text x="30" y="120" class="title">clanes</text>
  <text x="30" y="138" class="attr">id_clan PK</text>
  <text x="30" y="154" class="attr">nombre_clan UNIQUE</text>
  <text x="30" y="170" class="attr">region</text>

  <rect x="20" y="220" width="200" height="80" class="box"/>
  <text x="30" y="240" class="title">jugadores</text>
  <text x="30" y="258" class="attr">id_jugador PK</text>
  <text x="30" y="274" class="attr">id_clan FK, gamertag, rol</text>

  <rect x="450" y="30" width="260" height="220" class="box"/>
  <text x="460" y="50" class="title">scrims</text>
  <text x="460" y="68" class="attr">id_scrim PK</text>
  <text x="460" y="84" class="attr">id_clan_local FK -&gt; clanes</text>
  <text x="460" y="100" class="attr">id_clan_rival FK -&gt; clanes</text>
  <text x="460" y="116" class="attr">mapa</text>
  <text x="460" y="132" class="attr">marcador_local</text>
  <text x="460" y="148" class="attr">marcador_rival</text>
  <text x="460" y="164" class="attr">fecha_scrim</text>
  <text x="460" y="180" class="attr">estado</text>

  <line x1="220" y1="150" x2="450" y2="100"/>
  <text x="280" y="115" class="rel">1..N (local)</text>

  <line x1="220" y1="160" x2="450" y2="160"/>
  <text x="280" y="180" class="rel">1..N (rival)</text>

  <line x1="220" y1="240" x2="220" y2="150"/>
  <text x="150" y="200" class="rel">1..N</text>
</svg>
