<svg viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">nombre_cliente</text>
  <text x="30" y="90" class="attr">telefono UNIQUE</text>

  <rect x="330" y="20" width="200" height="90" class="box"/>
  <text x="340" y="40" class="title">motos</text>
  <text x="340" y="58" class="attr">id_moto PK</text>
  <text x="340" y="74" class="attr">id_cliente FK</text>
  <text x="340" y="90" class="attr">placa UNIQUE, modelo</text>

  <rect x="330" y="250" width="240" height="100" class="box"/>
  <text x="340" y="270" class="title">ordenes_servicio</text>
  <text x="340" y="288" class="attr">id_orden PK</text>
  <text x="340" y="304" class="attr">id_moto FK</text>
  <text x="340" y="320" class="attr">estado CHECK</text>

  <rect x="680" y="150" width="260" height="130" class="box"/>
  <text x="690" y="170" class="title">detalle_repuestos</text>
  <text x="690" y="188" class="attr">id_detalle PK</text>
  <text x="690" y="204" class="attr">id_orden FK, id_repuesto FK</text>
  <text x="690" y="220" class="attr">cantidad, precio_unitario</text>
  <text x="690" y="236" class="attr">UNIQUE(orden, repuesto)</text>

  <rect x="680" y="20" width="220" height="90" class="box"/>
  <text x="690" y="40" class="title">repuestos</text>
  <text x="690" y="58" class="attr">id_repuesto PK</text>
  <text x="690" y="74" class="attr">nombre_repuesto UNIQUE</text>
  <text x="690" y="90" class="attr">precio_unitario</text>

  <!-- clientes -> motos -->
  <line x1="220" y1="65" x2="330" y2="65" />
  <text x="240" y="55" class="rel">1:N</text>

  <!-- motos -> ordenes -->
  <line x1="430" y1="110" x2="440" y2="250" />
  <text x="440" y="180" class="rel">1:N</text>

  <!-- ordenes -> detalle -->
  <line x1="570" y1="300" x2="680" y2="250" />
  <text x="600" y="280" class="rel">1:N</text>

  <!-- repuestos -> detalle -->
  <line x1="790" y1="110" x2="790" y2="150" />
  <text x="800" y="135" class="rel">1:N</text>
</svg>
