<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="220" height="100" class="box"/>
  <text x="30" y="40" class="title">planes</text>
  <text x="30" y="58" class="attr">id_plan PK</text>
  <text x="30" y="74" class="attr">nombre_plan UNIQUE</text>
  <text x="30" y="90" class="attr">precio_mensual</text>
  <text x="30" y="106" class="attr">clases_por_semana</text>

  <rect x="20" y="200" width="220" height="90" class="box"/>
  <text x="30" y="220" class="title">entrenadores</text>
  <text x="30" y="238" class="attr">id_entrenador PK</text>
  <text x="30" y="254" class="attr">nombre_entrenador UNIQUE</text>
  <text x="30" y="270" class="attr">especialidad</text>

  <rect x="380" y="20" width="220" height="110" class="box"/>
  <text x="390" y="40" class="title">alumnos</text>
  <text x="390" y="58" class="attr">id_alumno PK</text>
  <text x="390" y="74" class="attr">nombre_alumno UNIQUE</text>
  <text x="390" y="90" class="attr">id_plan FK, fecha_inscripcion</text>
  <text x="390" y="106" class="attr">estado</text>

  <rect x="720" y="110" width="260" height="120" class="box"/>
  <text x="730" y="130" class="title">asistencias</text>
  <text x="730" y="148" class="attr">id_asistencia PK</text>
  <text x="730" y="164" class="attr">id_alumno FK, id_entrenador FK</text>
  <text x="730" y="180" class="attr">fecha_clase, estado</text>

  <line x1="240" y1="70" x2="380" y2="70"/>
  <text x="270" y="63" class="rel">1..N</text>

  <line x1="600" y1="90" x2="720" y2="170"/>
  <text x="640" y="120" class="rel">1..N</text>

  <line x1="240" y1="245" x2="720" y2="200"/>
  <text x="400" y="240" class="rel">1..N</text>
</svg>
