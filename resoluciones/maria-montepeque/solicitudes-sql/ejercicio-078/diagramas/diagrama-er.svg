<svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="200" height="90" class="box"/>
  <text x="30" y="40" class="title">equipos</text>
  <text x="30" y="58" class="attr">id_equipo PK</text>
  <text x="30" y="74" class="attr">nombre_equipo UNIQUE</text>
  <text x="30" y="90" class="attr">region</text>

  <rect x="20" y="270" width="200" height="80" class="box"/>
  <text x="30" y="290" class="title">jugadores</text>
  <text x="30" y="308" class="attr">id_jugador PK</text>
  <text x="30" y="324" class="attr">nickname UNIQUE, id_equipo FK</text>

  <rect x="330" y="20" width="220" height="90" class="box"/>
  <text x="340" y="40" class="title">ranking</text>
  <text x="340" y="58" class="attr">id_ranking PK</text>
  <text x="340" y="74" class="attr">id_equipo FK UNIQUE (1:1)</text>
  <text x="340" y="90" class="attr">puntos_totales</text>

  <rect x="330" y="250" width="230" height="100" class="box"/>
  <text x="340" y="270" class="title">partidas</text>
  <text x="340" y="288" class="attr">id_partida PK</text>
  <text x="340" y="304" class="attr">id_equipo_local/visitante FK</text>
  <text x="340" y="320" class="attr">estado CHECK</text>

  <rect x="680" y="250" width="260" height="120" class="box"/>
  <text x="690" y="270" class="title">estadisticas</text>
  <text x="690" y="288" class="attr">id_estadistica PK</text>
  <text x="690" y="304" class="attr">id_partida FK, id_jugador FK</text>
  <text x="690" y="320" class="attr">puntos, UNIQUE(partida,jugador)</text>

  <!-- equipos -> jugadores -->
  <line x1="120" y1="110" x2="120" y2="270" />
  <text x="130" y="190" class="rel">1:N</text>

  <!-- equipos -> ranking -->
  <line x1="220" y1="65" x2="330" y2="65" />
  <text x="240" y="55" class="rel">1:1</text>

  <!-- equipos -> partidas -->
  <line x1="220" y1="90" x2="330" y2="290" />
  <text x="250" y="200" class="rel">1:N</text>

  <!-- partidas -> estadisticas -->
  <line x1="560" y1="300" x2="680" y2="300" />
  <text x="590" y="290" class="rel">1:N</text>

  <!-- jugadores -> estadisticas -->
  <line x1="220" y1="310" x2="680" y2="330" />
  <text x="450" y="335" class="rel">1:N</text>
</svg>
