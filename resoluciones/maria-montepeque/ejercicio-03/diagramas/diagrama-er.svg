<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="70" class="box"/>
  <text x="30" y="40" class="title">autores</text>
  <text x="30" y="58" class="attr">id_autor PK</text>
  <text x="30" y="74" class="attr">nombre UNIQUE</text>

  <rect x="350" y="20" width="200" height="130" class="box"/>
  <text x="360" y="40" class="title">libros</text>
  <text x="360" y="58" class="attr">id_libro PK</text>
  <text x="360" y="74" class="attr">id_autor FK</text>
  <text x="360" y="90" class="attr">titulo, genero</text>
  <text x="360" y="106" class="attr">anio_publicacion</text>
  <text x="360" y="122" class="attr">stock</text>

  <rect x="20" y="280" width="190" height="90" class="box"/>
  <text x="30" y="300" class="title">campers</text>
  <text x="30" y="318" class="attr">id_camper PK</text>
  <text x="30" y="334" class="attr">nombre, ficha</text>
  <text x="30" y="350" class="attr">correo UNIQUE</text>

  <rect x="640" y="150" width="220" height="140" class="box"/>
  <text x="650" y="170" class="title">prestamos</text>
  <text x="650" y="188" class="attr">id_prestamo PK</text>
  <text x="650" y="204" class="attr">id_camper FK</text>
  <text x="650" y="220" class="attr">id_libro FK</text>
  <text x="650" y="236" class="attr">fecha_prestamo</text>
  <text x="650" y="252" class="attr">fecha_devolucion</text>
  <text x="650" y="268" class="attr">estado</text>

  <line x1="450" y1="150" x2="700" y2="200"/>
  <text x="550" y="170" class="rel">1..N</text>

  <line x1="210" y1="330" x2="640" y2="240"/>
  <text x="380" y="300" class="rel">1..N</text>
</svg>
