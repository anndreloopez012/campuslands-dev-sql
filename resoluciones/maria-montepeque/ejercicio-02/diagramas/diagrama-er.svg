<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="80" class="box"/>
  <text x="30" y="40" class="title">categorias</text>
  <text x="30" y="58" class="attr">id_categoria PK</text>
  <text x="30" y="74" class="attr">nombre UNIQUE</text>

  <rect x="350" y="20" width="200" height="120" class="box"/>
  <text x="360" y="40" class="title">productos</text>
  <text x="360" y="58" class="attr">id_producto PK</text>
  <text x="360" y="74" class="attr">id_categoria FK</text>
  <text x="360" y="90" class="attr">nombre, precio</text>
  <text x="360" y="106" class="attr">stock</text>

  <rect x="20" y="280" width="190" height="100" class="box"/>
  <text x="30" y="300" class="title">clientes</text>
  <text x="30" y="318" class="attr">id_cliente PK</text>
  <text x="30" y="334" class="attr">nombre</text>
  <text x="30" y="350" class="attr">correo UNIQUE</text>
  <text x="30" y="366" class="attr">telefono</text>

  <rect x="640" y="150" width="220" height="140" class="box"/>
  <text x="650" y="170" class="title">ventas</text>
  <text x="650" y="188" class="attr">id_venta PK</text>
  <text x="650" y="204" class="attr">id_cliente FK</text>
  <text x="650" y="220" class="attr">id_producto FK</text>
  <text x="650" y="236" class="attr">cantidad</text>
  <text x="650" y="252" class="attr">precio_unitario</text>
  <text x="650" y="268" class="attr">fecha_venta</text>

  <line x1="450" y1="140" x2="700" y2="200"/>
  <text x="550" y="160" class="rel">1..N</text>

  <line x1="210" y1="330" x2="640" y2="240"/>
  <text x="380" y="300" class="rel">1..N</text>
</svg>
