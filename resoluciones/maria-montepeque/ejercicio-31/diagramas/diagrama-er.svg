<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="90" class="box" />
  <text x="45" y="52" class="title">clientes</text>
  <text x="45" y="72" class="attr">id_cliente (PK)</text>
  <text x="45" y="90" class="attr">email (UNIQUE)</text>

  <rect x="700" y="30" width="220" height="90" class="box" />
  <text x="715" y="52" class="title">vendedores</text>
  <text x="715" y="72" class="attr">id_vendedor (PK)</text>
  <text x="715" y="90" class="attr">nombre, sucursal</text>

  <rect x="700" y="250" width="220" height="90" class="box" />
  <text x="715" y="272" class="title">productos</text>
  <text x="715" y="292" class="attr">id_producto (PK)</text>
  <text x="715" y="310" class="attr">nombre (UNIQUE), precio_unitario (CHECK)</text>

  <rect x="370" y="150" width="250" height="120" class="box" />
  <text x="385" y="172" class="title">ventas</text>
  <text x="385" y="192" class="attr">id_venta (PK)</text>
  <text x="385" y="210" class="attr">id_cliente (FK), id_vendedor (FK)</text>
  <text x="385" y="228" class="attr">fecha</text>

  <rect x="30" y="250" width="250" height="120" class="box" />
  <text x="45" y="272" class="title">detalle_venta</text>
  <text x="45" y="292" class="attr">id_detalle (PK)</text>
  <text x="45" y="310" class="attr">id_venta (FK), id_producto (FK)</text>
  <text x="45" y="328" class="attr">cantidad (CHECK), precio_unitario (CHECK)</text>

  <path d="M250,75 C310,75 310,210 370,210" class="rel" />
  <text x="290" y="140" class="lbl">1 : N</text>

  <path d="M700,75 C660,75 660,210 620,210" class="rel" />
  <text x="650" y="140" class="lbl">1 : N</text>

  <path d="M370,240 H280" class="rel" />
  <text x="300" y="232" class="lbl">1 : N</text>

  <path d="M280,300 C500,300 500,300 700,300" class="rel" stroke-dasharray="4 3" />
  <text x="460" y="292" class="lbl">1 : N</text>
</svg>
