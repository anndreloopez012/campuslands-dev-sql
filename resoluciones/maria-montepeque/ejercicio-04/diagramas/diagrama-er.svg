<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="80" class="box"/>
  <text x="30" y="40" class="title">mesas</text>
  <text x="30" y="58" class="attr">id_mesa PK</text>
  <text x="30" y="74" class="attr">numero UNIQUE</text>

  <rect x="350" y="20" width="200" height="90" class="box"/>
  <text x="360" y="40" class="title">pedidos</text>
  <text x="360" y="58" class="attr">id_pedido PK</text>
  <text x="360" y="74" class="attr">id_mesa FK</text>
  <text x="360" y="90" class="attr">fecha_hora, estado</text>

  <rect x="20" y="280" width="190" height="90" class="box"/>
  <text x="30" y="300" class="title">platos</text>
  <text x="30" y="318" class="attr">id_plato PK</text>
  <text x="30" y="334" class="attr">nombre UNIQUE</text>
  <text x="30" y="350" class="attr">categoria, precio</text>

  <rect x="640" y="150" width="220" height="140" class="box"/>
  <text x="650" y="170" class="title">detalle_pedido</text>
  <text x="650" y="188" class="attr">id_detalle PK</text>
  <text x="650" y="204" class="attr">id_pedido FK</text>
  <text x="650" y="220" class="attr">id_plato FK</text>
  <text x="650" y="236" class="attr">cantidad</text>
  <text x="650" y="252" class="attr">precio_unitario</text>
  <text x="650" y="268" class="attr">UNIQUE(id_pedido,id_plato)</text>

  <line x1="450" y1="110" x2="700" y2="200"/>
  <text x="560" y="150" class="rel">1..N</text>

  <line x1="210" y1="330" x2="640" y2="240"/>
  <text x="380" y="300" class="rel">1..N</text>
</svg>
