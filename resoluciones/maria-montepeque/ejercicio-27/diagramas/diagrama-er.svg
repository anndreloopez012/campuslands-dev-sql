<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="80" class="box" />
  <text x="45" y="52" class="title">categorias</text>
  <text x="45" y="72" class="attr">id_categoria (PK)</text>
  <text x="45" y="90" class="attr">nombre (UNIQUE)</text>

  <rect x="700" y="30" width="220" height="90" class="box" />
  <text x="715" y="52" class="title">instructores</text>
  <text x="715" y="72" class="attr">id_instructor (PK)</text>
  <text x="715" y="90" class="attr">correo (UNIQUE)</text>

  <rect x="370" y="150" width="250" height="140" class="box" />
  <text x="385" y="172" class="title">cursos</text>
  <text x="385" y="192" class="attr">id_curso (PK)</text>
  <text x="385" y="210" class="attr">id_categoria (FK, INDEX)</text>
  <text x="385" y="228" class="attr">id_instructor (FK)</text>
  <text x="385" y="246" class="attr">nombre (UNIQUE)</text>
  <text x="385" y="264" class="attr">precio (CHECK), duracion_horas (CHECK)</text>

  <rect x="30" y="250" width="260" height="140" class="box" />
  <text x="45" y="272" class="title">inscripciones</text>
  <text x="45" y="292" class="attr">id_inscripcion (PK)</text>
  <text x="45" y="310" class="attr">id_curso (FK, INDEX)</text>
  <text x="45" y="328" class="attr">estudiante_correo (INDEX)</text>
  <text x="45" y="346" class="attr">fecha_inscripcion, estado (CHECK)</text>

  <path d="M250,70 C310,70 310,215 370,215" class="rel" />
  <text x="290" y="140" class="lbl">1 : N</text>

  <path d="M700,75 C660,75 660,215 620,215" class="rel" />
  <text x="650" y="140" class="lbl">1 : N</text>

  <path d="M370,290 H290" class="rel" />
  <text x="300" y="282" class="lbl">1 : N</text>
</svg>
