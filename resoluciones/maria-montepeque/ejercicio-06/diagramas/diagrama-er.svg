<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="70" class="box"/>
  <text x="30" y="40" class="title">equipos</text>
  <text x="30" y="58" class="attr">id_equipo PK</text>
  <text x="30" y="74" class="attr">nombre UNIQUE</text>

  <rect x="20" y="280" width="190" height="90" class="box"/>
  <text x="30" y="300" class="title">jugadores</text>
  <text x="30" y="318" class="attr">id_jugador PK</text>
  <text x="30" y="334" class="attr">id_equipo FK</text>
  <text x="30" y="350" class="attr">nickname UNIQUE, rol</text>

  <rect x="350" y="20" width="220" height="120" class="box"/>
  <text x="360" y="40" class="title">partidas</text>
  <text x="360" y="58" class="attr">id_partida PK</text>
  <text x="360" y="74" class="attr">equipo_local FK</text>
  <text x="360" y="90" class="attr">equipo_visitante FK</text>
  <text x="360" y="106" class="attr">fecha_partida, mapa</text>

  <rect x="640" y="150" width="230" height="140" class="box"/>
  <text x="650" y="170" class="title">resultados</text>
  <text x="650" y="188" class="attr">id_resultado PK</text>
  <text x="650" y="204" class="attr">id_partida FK</text>
  <text x="650" y="220" class="attr">id_jugador FK</text>
  <text x="650" y="236" class="attr">kills, muertes</text>
  <text x="650" y="252" class="attr">puntos</text>
  <text x="650" y="268" class="attr">UNIQUE(id_partida,id_jugador)</text>

  <line x1="450" y1="140" x2="700" y2="200"/>
  <text x="560" y="160" class="rel">1..N</text>

  <line x1="210" y1="330" x2="640" y2="240"/>
  <text x="380" y="300" class="rel">1..N</text>

  <line x1="210" y1="60" x2="360" y2="80"/>
  <text x="270" y="60" class="rel">1..N</text>
</svg>
