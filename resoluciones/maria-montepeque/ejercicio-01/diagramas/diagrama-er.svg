<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="180" height="110" class="box"/>
  <text x="30" y="40" class="title">peliculas</text>
  <text x="30" y="58" class="attr">id_pelicula PK</text>
  <text x="30" y="74" class="attr">titulo, genero</text>
  <text x="30" y="90" class="attr">duracion_min</text>
  <text x="30" y="106" class="attr">clasificacion</text>

  <rect x="20" y="280" width="180" height="90" class="box"/>
  <text x="30" y="300" class="title">salas</text>
  <text x="30" y="318" class="attr">id_sala PK</text>
  <text x="30" y="334" class="attr">nombre UNIQUE</text>
  <text x="30" y="350" class="attr">capacidad</text>

  <rect x="350" y="150" width="200" height="120" class="box"/>
  <text x="360" y="170" class="title">funciones</text>
  <text x="360" y="188" class="attr">id_funcion PK</text>
  <text x="360" y="204" class="attr">id_pelicula FK</text>
  <text x="360" y="220" class="attr">id_sala FK</text>
  <text x="360" y="236" class="attr">fecha_hora</text>
  <text x="360" y="252" class="attr">precio_base</text>

  <rect x="680" y="150" width="200" height="140" class="box"/>
  <text x="690" y="170" class="title">boletos</text>
  <text x="690" y="188" class="attr">id_boleto PK</text>
  <text x="690" y="204" class="attr">id_funcion FK</text>
  <text x="690" y="220" class="attr">asiento</text>
  <text x="690" y="236" class="attr">precio_pagado</text>
  <text x="690" y="252" class="attr">estado</text>
  <text x="690" y="268" class="attr">fecha_compra</text>

  <line x1="200" y1="75" x2="350" y2="190"/>
  <text x="240" y="120" class="rel">1..N</text>

  <line x1="200" y1="325" x2="350" y2="230"/>
  <text x="240" y="300" class="rel">1..N</text>

  <line x1="550" y1="210" x2="680" y2="220"/>
  <text x="590" y="205" class="rel">1..N</text>
</svg>
