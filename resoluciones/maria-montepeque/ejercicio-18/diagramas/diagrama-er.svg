<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="100" class="box" />
  <text x="45" y="52" class="title">laboratorios</text>
  <text x="45" y="72" class="attr">id_laboratorio (PK)</text>
  <text x="45" y="90" class="attr">nombre (UNIQUE), pais</text>

  <rect x="340" y="30" width="230" height="130" class="box" />
  <text x="355" y="52" class="title">medicamentos</text>
  <text x="355" y="72" class="attr">id_medicamento (PK)</text>
  <text x="355" y="90" class="attr">id_laboratorio (FK)</text>
  <text x="355" y="108" class="attr">nombre (UNIQUE)</text>
  <text x="355" y="126" class="attr">precio_venta (CHECK), stock (CHECK)</text>

  <rect x="30" y="250" width="220" height="120" class="box" />
  <text x="45" y="272" class="title">compras</text>
  <text x="45" y="292" class="attr">id_compra (PK)</text>
  <text x="45" y="310" class="attr">id_medicamento (FK)</text>
  <text x="45" y="328" class="attr">cantidad (CHECK)</text>
  <text x="45" y="346" class="attr">precio_unitario (CHECK), fecha</text>

  <rect x="340" y="250" width="230" height="120" class="box" />
  <text x="355" y="272" class="title">ventas</text>
  <text x="355" y="292" class="attr">id_venta (PK)</text>
  <text x="355" y="310" class="attr">id_medicamento (FK)</text>
  <text x="355" y="328" class="attr">cantidad (CHECK)</text>
  <text x="355" y="346" class="attr">precio_unitario (CHECK), fecha</text>

  <path d="M250,90 H340" class="rel" />
  <text x="270" y="82" class="lbl">1 : N</text>

  <path d="M250,310 C300,310 300,160 450,160" class="rel" />
  <text x="270" y="302" class="lbl">1 : N</text>

  <path d="M455,160 V250" class="rel" />
  <text x="465" y="210" class="lbl">1 : N</text>
</svg>
