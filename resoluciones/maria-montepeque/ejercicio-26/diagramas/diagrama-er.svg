<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="90" class="box" />
  <text x="45" y="52" class="title">clientes</text>
  <text x="45" y="72" class="attr">id_cliente (PK)</text>
  <text x="45" y="90" class="attr">correo (UNIQUE)</text>

  <rect x="700" y="30" width="220" height="80" class="box" />
  <text x="715" y="52" class="title">categorias</text>
  <text x="715" y="72" class="attr">id_categoria (PK)</text>
  <text x="715" y="90" class="attr">nombre (UNIQUE)</text>

  <rect x="700" y="200" width="220" height="120" class="box" />
  <text x="715" y="222" class="title">productos</text>
  <text x="715" y="242" class="attr">id_producto (PK)</text>
  <text x="715" y="260" class="attr">id_categoria (FK)</text>
  <text x="715" y="278" class="attr">nombre, precio (CHECK)</text>

  <rect x="370" y="150" width="250" height="130" class="box" />
  <text x="385" y="172" class="title">compras</text>
  <text x="385" y="192" class="attr">id_compra (PK)</text>
  <text x="385" y="210" class="attr">id_cliente (FK), id_producto (FK)</text>
  <text x="385" y="228" class="attr">cantidad (CHECK), fecha</text>

  <path d="M250,80 C310,80 310,215 370,215" class="rel" />
  <text x="290" y="140" class="lbl">1 : N</text>

  <path d="M700,250 H620" class="rel" />
  <text x="650" y="242" class="lbl">1 : N</text>

  <path d="M700,70 C660,70 660,250 700,250" class="rel" stroke-dasharray="4 3" />
  <text x="640" y="160" class="lbl">1 : N</text>
</svg>
