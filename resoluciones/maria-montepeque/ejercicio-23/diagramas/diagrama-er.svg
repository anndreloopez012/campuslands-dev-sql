<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="110" class="box" />
  <text x="45" y="52" class="title">clientes</text>
  <text x="45" y="72" class="attr">id_cliente (PK)</text>
  <text x="45" y="90" class="attr">nit (UNIQUE)</text>
  <text x="45" y="108" class="attr">correo (UNIQUE)</text>

  <rect x="700" y="30" width="220" height="100" class="box" />
  <text x="715" y="52" class="title">productos</text>
  <text x="715" y="72" class="attr">id_producto (PK)</text>
  <text x="715" y="90" class="attr">nombre (UNIQUE)</text>
  <text x="715" y="108" class="attr">precio_unitario (CHECK)</text>

  <rect x="30" y="250" width="230" height="130" class="box" />
  <text x="45" y="272" class="title">facturas</text>
  <text x="45" y="292" class="attr">id_factura (PK)</text>
  <text x="45" y="310" class="attr">id_cliente (FK)</text>
  <text x="45" y="328" class="attr">fecha, subtotal (CHECK)</text>
  <text x="45" y="346" class="attr">impuesto (CHECK), total (CHECK)</text>

  <rect x="370" y="150" width="260" height="140" class="box" />
  <text x="385" y="172" class="title">detalle_factura</text>
  <text x="385" y="192" class="attr">id_detalle (PK)</text>
  <text x="385" y="210" class="attr">id_factura (FK)</text>
  <text x="385" y="228" class="attr">id_producto (FK)</text>
  <text x="385" y="246" class="attr">cantidad (CHECK)</text>
  <text x="385" y="264" class="attr">precio_unitario (CHECK)</text>

  <path d="M250,90 C310,90 310,315 370,315" class="rel" />
  <text x="290" y="140" class="lbl">1 : N</text>

  <path d="M260,315 H370" class="rel" />
  <text x="290" y="307" class="lbl">1 : N</text>

  <path d="M630,220 C670,220 670,90 700,90" class="rel" />
  <text x="650" y="140" class="lbl">1 : N</text>
</svg>
