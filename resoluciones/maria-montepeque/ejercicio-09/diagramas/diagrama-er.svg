<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="70" class="box"/>
  <text x="30" y="40" class="title">clientes</text>
  <text x="30" y="58" class="attr">id_cliente PK</text>
  <text x="30" y="74" class="attr">correo UNIQUE</text>

  <rect x="20" y="280" width="190" height="90" class="box"/>
  <text x="30" y="300" class="title">planes</text>
  <text x="30" y="318" class="attr">id_plan PK</text>
  <text x="30" y="334" class="attr">nombre UNIQUE</text>
  <text x="30" y="350" class="attr">duracion_meses, precio</text>

  <rect x="350" y="140" width="220" height="130" class="box"/>
  <text x="360" y="160" class="title">membresias</text>
  <text x="360" y="178" class="attr">id_membresia PK</text>
  <text x="360" y="194" class="attr">id_cliente FK</text>
  <text x="360" y="210" class="attr">id_plan FK</text>
  <text x="360" y="226" class="attr">fecha_inicio, fecha_fin</text>
  <text x="360" y="242" class="attr">estado</text>

  <rect x="660" y="150" width="220" height="110" class="box"/>
  <text x="670" y="170" class="title">pagos</text>
  <text x="670" y="188" class="attr">id_pago PK</text>
  <text x="670" y="204" class="attr">id_membresia FK</text>
  <text x="670" y="220" class="attr">monto, metodo</text>
  <text x="670" y="236" class="attr">fecha_pago</text>

  <line x1="210" y1="55" x2="350" y2="180"/>
  <text x="260" y="120" class="rel">1..N</text>

  <line x1="210" y1="320" x2="350" y2="240"/>
  <text x="260" y="290" class="rel">1..N</text>

  <line x1="570" y1="200" x2="660" y2="200"/>
  <text x="600" y="190" class="rel">1..N</text>
</svg>
