<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { font-size: 11px; fill: #556; }
    line { stroke: #33475b; stroke-width: 1.5; }
  </style>

  <rect x="20" y="20" width="190" height="70" class="box"/>
  <text x="30" y="40" class="title">marcas</text>
  <text x="30" y="58" class="attr">id_marca PK</text>
  <text x="30" y="74" class="attr">nombre UNIQUE</text>

  <rect x="350" y="20" width="200" height="130" class="box"/>
  <text x="360" y="40" class="title">bicicletas</text>
  <text x="360" y="58" class="attr">id_bicicleta PK</text>
  <text x="360" y="74" class="attr">id_marca FK</text>
  <text x="360" y="90" class="attr">modelo, tipo</text>
  <text x="360" y="106" class="attr">precio, stock</text>

  <rect x="20" y="280" width="190" height="90" class="box"/>
  <text x="30" y="300" class="title">proveedores</text>
  <text x="30" y="318" class="attr">id_proveedor PK</text>
  <text x="30" y="334" class="attr">nombre UNIQUE</text>
  <text x="30" y="350" class="attr">telefono</text>

  <rect x="640" y="150" width="230" height="140" class="box"/>
  <text x="650" y="170" class="title">movimientos_inventario</text>
  <text x="650" y="188" class="attr">id_movimiento PK</text>
  <text x="650" y="204" class="attr">id_bicicleta FK</text>
  <text x="650" y="220" class="attr">id_proveedor FK</text>
  <text x="650" y="236" class="attr">tipo_movimiento</text>
  <text x="650" y="252" class="attr">cantidad</text>
  <text x="650" y="268" class="attr">fecha_movimiento</text>

  <line x1="450" y1="150" x2="700" y2="200"/>
  <text x="550" y="170" class="rel">1..N</text>

  <line x1="210" y1="330" x2="640" y2="240"/>
  <text x="380" y="300" class="rel">1..N</text>
</svg>
