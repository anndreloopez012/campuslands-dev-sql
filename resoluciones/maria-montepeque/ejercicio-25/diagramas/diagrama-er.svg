<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill: #f5f7fa; stroke: #33475b; stroke-width: 1.5; }
    .title { font-weight: bold; font-size: 14px; fill: #12233a; }
    .attr { font-size: 12px; fill: #33475b; }
    .rel { stroke: #33475b; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 11px; fill: #12233a; }
  </style>

  <rect x="30" y="30" width="220" height="90" class="box" />
  <text x="45" y="52" class="title">sedes</text>
  <text x="45" y="72" class="attr">id_sede (PK)</text>
  <text x="45" y="90" class="attr">nombre (UNIQUE), ciudad</text>

  <rect x="340" y="30" width="230" height="120" class="box" />
  <text x="355" y="52" class="title">libros</text>
  <text x="355" y="72" class="attr">id_libro (PK)</text>
  <text x="355" y="90" class="attr">id_sede (FK)</text>
  <text x="355" y="108" class="attr">titulo, autor</text>
  <text x="355" y="126" class="attr">isbn (UNIQUE)</text>

  <rect x="30" y="250" width="220" height="90" class="box" />
  <text x="45" y="272" class="title">usuarios</text>
  <text x="45" y="292" class="attr">id_usuario (PK)</text>
  <text x="45" y="310" class="attr">correo (UNIQUE)</text>

  <rect x="340" y="250" width="260" height="140" class="box" />
  <text x="355" y="272" class="title">prestamos</text>
  <text x="355" y="292" class="attr">id_prestamo (PK)</text>
  <text x="355" y="310" class="attr">id_libro (FK), id_usuario (FK)</text>
  <text x="355" y="328" class="attr">fecha_prestamo, fecha_devolucion</text>
  <text x="355" y="346" class="attr">estado (CHECK)</text>

  <path d="M250,80 H340" class="rel" />
  <text x="270" y="72" class="lbl">1 : N</text>

  <path d="M250,300 H340" class="rel" />
  <text x="270" y="292" class="lbl">1 : N</text>

  <path d="M455,150 V250" class="rel" />
  <text x="465" y="210" class="lbl">1 : N</text>
</svg>
